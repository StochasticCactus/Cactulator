name: build

on:
  push:
  pull_request:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ncurses (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - name: Build with make
        run: make -j4
      - name: Core tests
        run: make test
      - name: Smoke test
        run: |
          ./cactulator --fresh -e "2+3*4" -e "inv([[1,2],[3,4]])" -e "5 km to mi"
          printf 'x = 3\nf(x) = x^2\nf(4)\n' | ./cactulator --fresh
      - name: Build with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ncurses
            make
      - name: Build
        run: |
          cmake -B build -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: ./build/cactulator.exe --fresh -e "2+3*4" -e "solve(x^2 = 2, x)"
